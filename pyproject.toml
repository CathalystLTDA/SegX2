[project]
name = "segx"
version = "0.1.0"
description = "SegX — engine for measuring dynamic (experienced) spatial segregation along trajectories"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Cathalyst" }]
dependencies = [
    # --- geospatial core ---
    "osmnx>=2.0",
    "quackosm>=0.11",
    "networkx>=3.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    # --- routing (core, not optional) ---
    # Pandana is the default routing engine (contraction hierarchies) and a core
    # dependency from P3 onward. It installs from a prebuilt wheel
    # (incl. win_amd64) on Python 3.11 + numpy<2, which is exactly why the project
    # is pinned to those (below). NetworkX stays as the validation oracle.
    "pandana>=0.7",
    # igraph is the k-shortest-path / route-set engine (link-penalty over mutable
    # edge weights; pandana's precomputed CH can't do per-pair penalties). Core
    # dep. Ships prebuilt wheels (incl.
    # win_amd64) on Python 3.11, clearing the same wheel bar as pandana.
    "igraph>=0.11",
    # --- tabular / analytical ---
    # numpy pinned <2: pandana 0.7's compiled wheel is built against the numpy
    # 1.x ABI and fails to import under numpy 2.x. pandas kept on the 2.x line to
    # match (pandas 3.x tracks numpy 2). Revisit when pandana ships a numpy-2 wheel.
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    # pyarrow capped <18: from 18.0 the prebuilt wheels are compiled against the
    # numpy 2.x ABI and segfault at import under the numpy<2 pin above (the same
    # ABI story as pandana). Uncapped, uv resolved pyarrow 24.0.0, which crashes
    # every pandas import. Revisit together with the numpy<2 pin.
    "pyarrow>=15.0,<18",
    "duckdb>=1.0",
    # scipy for `gammaln` — the Hurlbert rarefaction in analysis/od_spread.py needs
    # log-factorials vectorised over millions of OD flows, which numpy has no
    # equivalent of. Already present transitively (pandana, osmnx) and ships
    # prebuilt wheels on 3.11/win_amd64; declared because we import it directly.
    "scipy>=1.11",
    # --- config / CLI / IO ---
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "openpyxl>=3.1",
    "osmium>=4.0",
    # --- figures (segx.figures: maps / segment maps / charts per run) ---
    # matplotlib renders headless (Agg); contextily draws the optional dark web-tile
    # basemap (figures.basemap) and degrades to no basemap when offline.
    "matplotlib>=3.8",
    "contextily>=1.6",
]

[project.scripts]
segx = "segx.cli:app"
# JSON-RPC-over-stdio sidecar entry point for the native app (see segx/rpc.py).
# This is the clean target for PyInstaller when freezing the embeddable engine.
segx-rpc = "segx.rpc:serve"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Extras for the demo runner in `demo/`. Install with: uv sync --group demo
# matplotlib and contextily are core dependencies now (segx.figures); the group is
# kept so `uv sync --group demo` keeps working. The demo's --no-basemap and the
# engine's figures.basemap=false both skip the web tiles.
demo = [
    "matplotlib>=3.8",
    "contextily>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["segx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests that exercise the full pipeline (enabled from P3 onward)",
]
